apiVersion: 1

datasources:
  - name: InfluxDB
    uid: influxdb_main
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: $__env{INFLUX_ORG}
      defaultBucket: $__env{INFLUX_BUCKET}
      httpHeaderName1: Authorization
    secureJsonData:
      httpHeaderValue1: Token $__env{INFLUX_TOKEN}
